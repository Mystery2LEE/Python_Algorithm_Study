name: Notion Sync

on:
  push:
    branches: [main, master]
    paths:
      - "week*/**/*.py"
  # Actions 탭에서 버튼으로 직접 실행 (전체 재동기화용)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 이전 커밋과 비교해야 하므로 전체 히스토리 필요
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Collect changed files
        run: |
          # 한글 등 비ASCII 파일명이 \354\235\264 형태로 깨지는 것을 방지
          git config core.quotepath false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git ls-files 'week*/**/*.py' > changed_files.txt
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            git ls-files 'week*/**/*.py' > changed_files.txt
          else
            git diff --name-only --diff-filter=AM \
              ${{ github.event.before }} ${{ github.sha }} \
              -- 'week*/**/*.py' > changed_files.txt
          fi

          echo "----- 대상 파일 -----"
          cat changed_files.txt
          echo "---------------------"

      - name: Sync to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if [ ! -s changed_files.txt ]; then
            echo "동기화할 파일이 없습니다."
            exit 0
          fi
          # 파일 목록을 그대로 스크립트에 전달 (셸 이스케이프 문제 회피)
          python scripts/notion_sync.py --from-file changed_files.txt
