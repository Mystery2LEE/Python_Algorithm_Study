name: Notion Sync

on:
  push:
    branches: [main, master]
    paths:
      - 'week*/**/*.py'
  # Actions 탭에서 버튼으로 직접 실행 (전체 재동기화용)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 이전 커밋과 비교해야 하므로 최소 2개 이상의 히스토리 필요
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Collect changed files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 수동 실행: 레포 전체 파일 대상
            FILES=$(git ls-files 'week*/**/*.py')
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            # 최초 push(브랜치 생성)인 경우: 전체 파일 대상
            FILES=$(git ls-files 'week*/**/*.py')
          else
            FILES=$(git diff --name-only --diff-filter=AM ${{ github.event.before }} ${{ github.sha }} -- 'week*/**/*.py')
          fi
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Sync to Notion
        if: steps.changed.outputs.files != ''
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          echo "${{ steps.changed.outputs.files }}" | while IFS= read -r f; do
            [ -z "$f" ] && continue
            python scripts/notion_sync.py "$f"
          done
